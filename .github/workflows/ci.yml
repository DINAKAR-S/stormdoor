name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check src tests bench

      - name: Test
        run: pytest -q

  # The reliability claims in the README come from this harness, so it has to
  # keep running. It needs no API key and no network: every drill runs against
  # the local echo provider.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv pip install --system -e ".[dev]"

      # Timings differ on every machine, so the numbers are not asserted. The
      # invariants behind them are: no overspend, every injected failure marked
      # retryable, every killed stream recorded as aborted rather than as a
      # success. The harness exits non-zero if any of those stop holding.
      - name: Run the proof harness
        run: python -m bench.harness
