[project]
name = "stormdoor"
version = "0.1.0"
description = "An LLM gateway that proves itself under failure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dinakar Selvakumar" }]
keywords = ["llm", "gateway", "proxy", "reliability", "chaos-engineering", "anthropic", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "typer>=0.15",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.55"]
redis = ["redis>=5.2"]
# The semantic cache runs on SQLite with a local embedder and needs none of
# these. Pinecone is the opt-in vector backend for scale; real embeddings reuse
# the openai extra.
pinecone = ["pinecone>=5.0"]
# Tracing needs the OTel SDK and the OTLP HTTP exporter; Stripe metering needs
# the Stripe SDK. Both features are off unless configured, so neither is a
# default dependency.
otel = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]
stripe = ["stripe>=10.0"]
all = [
  "anthropic>=0.40", "openai>=1.55", "redis>=5.2", "pinecone>=5.0",
  "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27",
  "stripe>=10.0",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  # Drives the app in-process through ASGI, so the tests and the bench harness
  # need no listening socket.
  "httpx>=0.27",
]

[project.scripts]
stormdoor = "stormdoor.cli:main"

[project.urls]
Homepage = "https://github.com/DINAKAR-S/stormdoor"
Issues = "https://github.com/DINAKAR-S/stormdoor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stormdoor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
